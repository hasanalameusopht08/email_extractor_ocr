version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: email_extractor_mq
    restart: unless-stopped
    ports:
      - "5673:5672"   # RabbitMQ port mapped to 5673
      - "15673:15672" # Management UI mapped to 15673
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - extractor-net

networks:
  extractor-net:
    driver: bridge

volumes:
  rabbitmq_data:
